<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">
    <h2>Admin Dashboard 👑</h2>

    <div>
        <a href="{{ url_for('admin') }}">Admin Dashboard</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</nav>

<div class="container">

    <h1>Add New Product</h1>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Product Name"
               required>

        <input type="text"
               name="description"
               placeholder="Product Description"
               required>

        <input type="number"
               name="price"
               placeholder="Price"
               step="0.01"
               required>

        <input type="text"
               name="image"
               placeholder="Image filename">

        <input type="number"
               name="stock"
               placeholder="Stock"
               required>

        <button type="submit">
            Add Product
        </button>

    </form>

</div>

</body>
</html>
